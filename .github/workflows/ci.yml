name: DermaLens CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Security Checks
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies for OpenCV and MediaPipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      - name: Verify release model artifact integrity
        run: |
          python -c "
          import hashlib, os, sys
          path = 'models/efficientnet_b0_skin_concerns.pth'
          expected = 'ba123334b476a24b710a78000a70b1d6dcc44ee100664673d6e61ed3d0827412'
          if not os.path.exists(path):
              print(f'CRITICAL: Release model artifact {path} is missing from build/repository!')
              sys.exit(1)
          actual = hashlib.sha256(open(path, 'rb').read()).hexdigest().lower()
          if actual != expected:
              print(f'CRITICAL: Checksum mismatch for {path}! Expected {expected}, got {actual}')
              sys.exit(1)
          print(f'SUCCESS: Verified release model artifact {path} (SHA-256: {actual})')
          "

      - name: Run backend tests
        env:
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-32-chars-minimum!!"
          ENVIRONMENT: "development"
          MONGODB_URI: "mongodb://localhost:27017/ci_test"
          MODEL_PATH: "models/efficientnet_b0_skin_concerns.pth"
        run: |
          pytest -o pythonpath=. tests/ -v

  frontend-build:
    name: Frontend Build, Lint & Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend code
        run: npm run lint

      - name: Type check and build frontend
        run: npm run build

  docker-lint:
    name: Dockerfile Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and validate container image
        run: |
          docker build -t dermalens-api:test -f backend/Dockerfile backend/
