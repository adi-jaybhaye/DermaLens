name: DermaLens CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Security Checks
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies for OpenCV and MediaPipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      - name: Ensure test model artifact exists
        run: |
          mkdir -p models
          python -c "
          import os, torch, torchvision.models as models
          path = 'models/efficientnet_b0_skin_concerns.pth'
          if not os.path.exists(path):
              m = models.efficientnet_b0(weights=None)
              m.classifier[1] = torch.nn.Linear(m.classifier[1].in_features, 8)
              ckpt = {
                  'model_state_dict': m.state_dict(),
                  'class_names': [
                      'Redness', 'dark spots', 'inflammatory acne',
                      'non inflammatory acne black heads', 'non inflammatory acne white heads',
                      'pigmentation', 'pores', 'wrinkles'
                  ]
              }
              torch.save(ckpt, path)
              print('Generated CI test checkpoint at', path)
          "

      - name: Run backend tests
        env:
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-32-chars-minimum!!"
          ENVIRONMENT: "development"
          MONGODB_URI: "mongodb://localhost:27017/ci_test"
          MODEL_PATH: "models/efficientnet_b0_skin_concerns.pth"
        run: |
          pytest -o pythonpath=. tests/ -v

  frontend-build:
    name: Frontend Build, Lint & Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend code
        run: npm run lint

      - name: Type check and build frontend
        run: npm run build

  docker-lint:
    name: Dockerfile Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validate Dockerfile syntax
        run: |
          docker build --dry-run -f backend/Dockerfile backend/
