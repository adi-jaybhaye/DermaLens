name: Build and Push DermaLens Backend to ACR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/build-push-acr.yml"

jobs:
  build-push:
    name: Build and Push Production Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build production image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/dermalens-api:v1.0.0 \
            backend

      - name: Push production image
        run: |
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/dermalens-api:v1.0.0

      - name: Verify image
        run: |
          echo "Pushed: ${{ secrets.ACR_LOGIN_SERVER }}/dermalens-api:v1.0.0"
