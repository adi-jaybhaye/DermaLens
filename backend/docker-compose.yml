version: '3.8'

services:
  dermlens-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dermlens_face_skin_assessment
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-face_skin_assessment}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-production_secret_key_change_me_12345}
      - ENVIRONMENT=production
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
